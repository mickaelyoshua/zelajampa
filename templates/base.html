<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZelaJampa - Zeladoria Urbana de João Pessoa{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .cluster-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
            border: 2px solid white;
            transition: transform 0.2s;
        }
        .cluster-marker:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-tight">🌿 ZelaJampa</span>
                <span class="text-xs bg-emerald-800 px-2.5 py-1 rounded-full font-medium uppercase tracking-wider text-emerald-200">João Pessoa</span>
            </div>
            <div class="text-sm text-emerald-100 hidden sm:block">
                Mapeamento & Agregação Espacial de Demandas Urbanas
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 text-slate-500 text-xs py-4 text-center">
        ZelaJampa &copy; 2026 João Pessoa - PB. Plataforma cívica em Rust, PostGIS, Axum e HTMX.
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
