<article class="p-4 bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow transition-shadow">
    <div class="flex items-start justify-between gap-2">
        <h3 class="font-semibold text-slate-800 text-base leading-snug">{{ report.title }}</h3>
        <span class="text-xs px-2.5 py-0.5 rounded-full border font-medium {{ report.category.badge_class() }}">
            {{ report.category.label() }}
        </span>
    </div>
    <p class="text-sm text-slate-600 mt-2 whitespace-pre-line">{{ report.description }}</p>
    <div class="flex items-center justify-between text-xs text-slate-400 mt-3 pt-2 border-t border-slate-100">
        <span>📍 {{ report.lat }}, {{ report.lon }}</span>
        <time datetime="{{ report.created_at }}">{{ report.created_at.format("%d/%m/%Y %H:%M") }}</time>
    </div>
</article>
